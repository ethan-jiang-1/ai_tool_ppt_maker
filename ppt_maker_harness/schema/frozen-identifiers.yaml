authority: preservation-inventory
scope: "The C1 frozen set only: fifteen historical record schemas and three live literals. C2 owns the complete runtime identifier inventory."

historical_record_schemas:
  - identifier: page-image-progressive-raw-item-attempt-v1
    kind: historical-record-schema
    read_policy: "Read and validate forever."
    write_policy: "Do not write new records under this identifier."
    reason: "Existing paid raw item-attempt records bind provider submissions, idempotency keys, and terminal status evidence."
  - identifier: page-image-progressive-raw-materialization-provenance-v1
    kind: historical-record-schema
    read_policy: "Read and validate forever."
    write_policy: "Do not write new records under this identifier."
    reason: "Existing provenance records bind stored raw bytes to the plan, grant, request, and paid attempt that produced them."
  - identifier: page-image-progressive-raw-complete-review-v1
    kind: historical-record-schema
    read_policy: "Read and validate forever."
    write_policy: "Do not write new records under this identifier."
    reason: "Existing complete-page review records preserve the human proceed or repair decision for generated evidence."
  - identifier: page-image-progressive-raw-batch-grant-v1
    kind: historical-record-schema
    read_policy: "Read and validate forever."
    write_policy: "Do not write new records under this identifier."
    reason: "Existing batch grants prove the bounded authorization scope for paid provider submissions."
  - identifier: page-image-progressive-raw-batch-projection-v1
    kind: historical-record-schema
    read_policy: "Read and validate forever."
    write_policy: "Do not write new records under this identifier."
    reason: "Existing batch projections preserve the ordered page scope and maximum submissions reviewed for a raw run."
  - identifier: page-image-progressive-raw-work-plan-v1
    kind: historical-record-schema
    read_policy: "Read and validate forever."
    write_policy: "Do not write new records under this identifier."
    reason: "Historical work-plan records bind source, workflow, and planned raw contracts that later paid evidence references."
  - identifier: page-image-progressive-raw-scope-head-v1
    kind: historical-record-schema
    read_policy: "Read and validate forever."
    write_policy: "Do not write new records under this identifier."
    reason: "Existing scope-head records preserve the generation lineage and predecessor plan relation for a version."
  - identifier: page-image-progressive-accepted-raw-evidence-v1
    kind: historical-record-schema
    read_policy: "Read and validate forever."
    write_policy: "Do not write new records under this identifier."
    reason: "Existing accepted-raw evidence is the record that allows finalization to link final page bytes to reviewed provider output."
  - identifier: page-image-style-master-candidate-attempt-v1
    kind: historical-record-schema
    read_policy: "Read and validate forever."
    write_policy: "Do not write new records under this identifier."
    reason: "Existing Style Master candidate attempts preserve each provider submission in visual-style lineage."
  - identifier: page-image-style-master-generated-provenance-v1
    kind: historical-record-schema
    read_policy: "Read and validate forever."
    write_policy: "Do not write new records under this identifier."
    reason: "Existing generated provenance records bind Style Master output bytes to the candidate generation that created them."
  - identifier: page-image-style-master-candidate-grant-v1
    kind: historical-record-schema
    read_policy: "Read and validate forever."
    write_policy: "Do not write new records under this identifier."
    reason: "Existing candidate grants preserve the approved provider scope for a Style Master candidate."
  - identifier: page-image-style-master-plan-identity-v1
    kind: historical-record-schema
    read_policy: "Read and validate forever."
    write_policy: "Do not write new records under this identifier."
    reason: "Existing plan-identity records bind a Style Master candidate plan to its source and workflow context."
  - identifier: page-image-style-master-review-decision-v1
    kind: historical-record-schema
    read_policy: "Read and validate forever."
    write_policy: "Do not write new records under this identifier."
    reason: "Existing Style Master review decisions preserve the human selection or repair outcome for candidate evidence."
  - identifier: page-image-style-master-local-provenance-v1
    kind: historical-record-schema
    read_policy: "Read and validate forever."
    write_policy: "Do not write new records under this identifier."
    reason: "Existing local provenance records bind locally prepared Style Master artifacts to their candidate evidence."
  - identifier: page-image-style-master-head-v1
    kind: historical-record-schema
    read_policy: "Read and validate forever."
    write_policy: "Do not write new records under this identifier."
    reason: "Existing Style Master head records preserve the selected candidate lineage for a workflow and source context."

live_literals:
  - identifier: page-image-workflow-v1
    kind: live-protocol-literal
    read_policy: "Read and continue writing where the current protocol requires it."
    write_policy: "Frozen against renaming."
    reason: "The literal prefixes computed provider idempotency keys that existing paid raw attempt records must validate exactly."
  - identifier: image2-page-workflow-v1
    kind: live-production-mode-literal
    read_policy: "Read and continue writing where the current production-mode contract requires it."
    write_policy: "Frozen against renaming."
    reason: "Existing version source and production-mode records use this literal to identify the selected image2 workflow."
  - identifier: mnemonic-v1
    kind: live-identity-literal
    read_policy: "Read and continue writing where the current slide-identity contract requires it."
    write_policy: "Frozen against renaming."
    reason: "Existing source documents and downstream records depend on this literal to interpret stable slide identities."
