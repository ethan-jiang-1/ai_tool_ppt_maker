schema_home: page-image-production-definitions
authority: conceptual-vocabulary
execution: non-executable

naming:
  stage_name: "Use the established unversioned kebab-case conceptual name."
  version_suffix: "Do not add a new -vN suffix to a conceptual stage name."
  serialization_contract: "Declare every active durable selector and wire schema in serialization-contracts.yaml."

stage_definition:
  required_keys:
    - schema
    - kind
    - scope
    - purpose
    - answers
    - owner
    - producer_status
    - inputs
    - outputs
    - provenance
    - downstream_consumers
    - does_not_contain
    - fields
    - publication
  kind_values:
    - source
    - derived
    - record
  producer_status_values:
    - materialized
  owner_rule: "Every stage names a real current owner; schema definitions do not reserve future producers or implementation routes."
  provenance_rule: "Every derived or record stage identifies the source, configuration, or upstream record needed to explain how it was made."

field_definition:
  required_keys:
    - type
    - description
  optional_keys:
    - producer
    - producer_status
  producer_status_note: "Field-level producer_status mirrors the stage-level
    materialized value; field-level producer names the parser/owner that
    materializes that field (e.g. page-source.yaml fields)."

  constrained_field:
    detection: "A field is constrained when it declares rule."
    required_keys:
      - type
      - description
      - rule
      - on_violation
  on_violation:
    required_keys:
      - means
      - ask
      - never
    author_language: "Use Deck Author terms. Do not name schema filenames or source field names."
    boundary: "Collaboration projection only; never an authorization, gate, record, state mutation, or CLI diagnostic."
  default:
    meaning: "An omitted value intentionally normalizes to this value."
    boundary: "A declared default is not an author error and is applied by a later runtime owner."
