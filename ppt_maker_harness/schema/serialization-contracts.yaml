  - stage_ref: image-generation-record
    role: raw-generation-evidence
    values:
      - page-image-adapter-accepted-raw-evidence
      - page-image-progressive-raw-item-attempt
      - page-image-progressive-raw-materialization-provenance
      - page-image-progressive-accepted-raw-evidence
      - page-image-progressive-raw-pilot-evidence
  - stage_ref: page-review-decision
    role: review-evidence
    values:
      - page-image-complete-page-review
      - page-image-complete-page-review-capture-profile
      - page-image-complete-page-review-presentation
      - page-image-pilot-page-review-presentation
      - page-image-framed-complete-page-binding
      - page-image-framed-pilot-review-contribution
      - page-image-pure-complete-page-binding
      - page-image-pure-pilot-review-contribution
      - page-image-progressive-raw-complete-review
      - page-image-progressive-raw-pilot-decision
      - page-image-target-raw-review-contribution
      - page-image-target-raw-review-projection-capture-profile
  - stage_ref: final-page-list
    role: final-page-selection
    values:
      - page-image-final-slide-manifest
      - page-image-pptx-assembly
  - stage_ref: delivery-package
    role: delivery-evidence
    values:
      - page-image-delivery-media
      - page-image-delivery-receipt
      - page-image-notes-receipt
  - stage_ref: visual-style-candidates
    role: style-master-lineage
    values:
