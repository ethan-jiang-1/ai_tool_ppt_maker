  - stage_ref: production-progress-state
    role: lifecycle-state
    values:
      - page-image-workflow-target-state
      - page-image-workflow-handoff
      - page-image-raw-manifest
      - pptmaker-page-image-raw-manifest

implementation_invariants:
  - name: Page Image runtime values are declared by the selector, shared-contract, or wire-schema group above.
  - name: Existing kind fields describe business or action semantics and are not serialization roles.
  - name: C3-C5 planned stages remain declarative; this inventory does not materialize their producers.
