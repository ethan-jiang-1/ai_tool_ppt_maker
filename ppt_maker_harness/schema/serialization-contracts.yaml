schema_home: page-image-production-definitions
authority: active-serialization-contracts
execution: non-executable

identifier_grammar:
  pattern: "lowercase kebab-case without a version suffix"
  rule: "Every active durable selector and wire schema uses one declared unversioned value."

selectors:
  production_pipeline: page-image-workflow
  production_adapter: page-image-workflow
  identity_scheme: mnemonic

image2_provider_capability:
  source_schema: pptmaker-image2-provider-profile
  source_locations:
    backbone: 2_backbone/visual-style/image2-provider-profile.yaml
    version_override: 3_versions/vN/overrides/visual-style/image2-provider-profile.yaml
  owner: deck-author
  resolver: scripts/shared/image2/provider_profile.mjs
  operations:
    - style-master-text-generation
    - page-image-reference-generation
  prompt_budget_units:
    - unicode-code-points
    - utf16-code-units
    - utf8-bytes
  limit_rule: positive-safe-integer-data
  runtime_selector:
    environment_variable: IMAGE2_PROVIDER_PROFILE_ID
    owner: environment
    rule: exact-match-resolved-profile-id
  does_not_contain:
    - credential
    - api-key
    - base-url
    - state-capability-ledger
    - provider-response

current_state_shape:
  name: md-controller-execution-state
  storage: _state/state.yaml
  owner: scripts/shared/state/state.mjs
  anchors:
    - scripts/shared/state/state.mjs#STATE_TOP_LEVEL_KEYS
    - scripts/shared/state/state.mjs#createDefaultState
    - scripts/shared/state/state.mjs#writeState
  required_top_level_fields:
    - pipeline
    - production_identity
    - playbook
    - current_node
    - execution_id
    - execution_started_at
    - run_version
    - continuation_target_version
    - started_at
    - updated_at
    - nodes
    - gates
    - deck
    - playbook_stack
  active_execution_fields:
    - playbook
    - current_node
    - execution_id
    - execution_started_at
    - run_version
  allowed_execution_fields:
    - page_image_raw_provider_authorization
    - page_image_target_evidence
    - page_image_progressive_handoff
    - page_image_task_mandate
    - page_image_style_master
    - diagnostics
  production_identity:
    storage: production_identity.by_version
    owner: scripts/shared/state/state.mjs
    anchors:
      - scripts/shared/run-bundle/production_identity.mjs#inspectProductionIdentity
      - scripts/shared/state/state.mjs#inspectRunProductionIdentity
    record_fields:
      - workflow
      - source_epoch
  execution_lease:
    name: current-execution-lease
    value: pptmaker-current-execution-lease
    storage: _state/current-execution-lease.json
    owner: scripts/shared/state/state.mjs
    anchors:
      - scripts/shared/state/state.mjs#EXECUTION_LEASE_SCHEMA
      - scripts/shared/state/state.mjs#executionLeaseRecord
    required_fields:
      - schema
      - active_run_version
      - state_sha256

semantic_exclusions:
  - name: yaml-parser-core-schema
    field: yaml.parseDocument.schema
    values:
      - core
    meaning: External YAML parser configuration, not a Harness durable contract.
  - name: style-master-plan-generation
    field: plan_generation
    values:
      - style-master-plan-generation
    owner: scripts/shared/image2/style_master_schema.mjs
    anchors:
      - scripts/shared/image2/style_master_schema.mjs#validateStyleMasterPlanIdentity
      - scripts/shared/image2/style_master_schema.mjs#validateStyleMasterHeadRecord
    meaning: Positive immutable plan ordering within one exact Run Bundle Work Version and workflow scope; it is not a selectable schema, reader, compiler, protocol, report, or manifest generation.

