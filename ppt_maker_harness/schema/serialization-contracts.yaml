implementation_invariants:
  - name: Page Image runtime values are declared by the selector, shared-contract, or wire-schema group above.
  - name: Existing kind fields describe business or action semantics and are not serialization roles.
  - name: Page Class materializes source facts, four layout-config contracts, and in-memory per-page presentation bindings; the derived publication exposes only the current provider-free per-page inspection projection.
  - name: Subject restrictions are declared on both workflow receipts, while Framed alone publishes selected-profile header_region and exact normalized protected_composition lineage; current Framed requests omit local header literals, header-derived context, and protected_geometry.
  - name: The static conformance sweep classifies YAML parser configuration and exact-scope Style Master plan ordering through semantic_exclusions, never by identifier-prefix allowlist.
  - name: The one resolved Image2 provider profile supplies both operation capability projections; selected generation-profile digests close profile ID, full profile digest, endpoint profile, route, model, operation, and prompt budget through existing plan, authorization, request, attempt, provenance, selection, and invalidation bindings.
  - name: Page Image and Style Master provider transport consumes only the bound model and exact compiled UTF-8 prompt bytes, with reference media in separate fields; inspection projects bound operation and measurement facts but cannot authorize or reconstruct a prompt.
