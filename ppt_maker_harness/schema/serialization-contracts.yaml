schema_home: page-image-production-definitions
authority: active-serialization-contracts
execution: non-executable

identifier_grammar:
  pattern: "lowercase kebab-case without a version suffix"
  rule: "Every active durable selector and wire schema uses one declared unversioned value."

selectors:
  production_pipeline: page-image-workflow
  production_mode: image2-page-workflow
  production_adapter: page-image-workflow
  identity_scheme: mnemonic
  framed_header_preset: standard

shared_contracts:
  - name: cli-diagnostic
    value: pptmaker-cli-diagnostic
    field: schema
    anchors:
      - scripts/shared/cli/cli_error.mjs#CLI_DIAGNOSTIC_SCHEMA
  - name: run-bundle-locator
    value: pptmaker-run-bundle
    field: schema
    anchors:
      - scripts/shared/run-bundle/run_bundle_locator.mjs#RUN_BUNDLE_SCHEMA
  - name: intent-route-catalog
    value: pptmaker-intent-routes
    field: schema
    anchors:
      - scripts/shared/workflow/intent_route_catalog.mjs#INTENT_ROUTE_CATALOG_SCHEMA
  - name: cli-return-audit
    value: pptmaker-cli-return-audit
    field: schema
    anchors:
      - scripts/contracts/cli_return_audit.mjs#CLI_RETURN_AUDIT_SCHEMA
  - name: source-test-ownership
    value: pptmaker-source-test-ownership
    field: schema
    anchors:
      - tests/contracts/source-test-ownership.json
  - name: development-verification-core
    value: pptmaker-development-verification-core
    field: schema
    anchors:
      - tests/contracts/run_development_verification.mjs
  - name: workflow-control-ledger
    value: pptmaker-workflow-control-ledger
    field: schema
    anchors:
      - ppt_maker_harness/workflow
  - name: harness-governance-ledger
    value: pptmaker-harness-governance-ledger
    field: schema
    anchors:
      - ppt_maker_harness/charter
  - name: controller-manifest
    value: pptmaker-controller-manifest
    field: schema
    anchors:
      - scripts/shared/state/md_controller_reader.mjs
  - name: workflow-goal-entry
    value: pptmaker-workflow-goal-entry
    field: schema
    anchors:
      - scripts/shared/workflow
  - name: workflow-inspection
    value: pptmaker-workflow-inspection
    field: schema
    anchors:
      - scripts/shared/workflow/inspect_workflow.mjs
  - name: framed-font-render-inventory
    value: pptmaker-framed-font-render-inventory
    field: schema
    anchors:
      - scripts/00-setup/internal/html_fonts.mjs
  - name: framed-font-selection
    value: pptmaker-framed-font-selection
    field: schema
    anchors:
      - scripts/00-setup/internal/html_fonts.mjs
  - name: framed-header-overlay-contract
    value: pptmaker-framed-header-overlay-contract
    field: schema
    anchors:
      - scripts/03-framed-image/internal/header_overlay.mjs
  - name: framed-header-overlay-layout-compiler
    value: pptmaker-framed-header-overlay-layout-compiler
    field: schema
    anchors:
      - scripts/03-framed-image/internal
  - name: framed-header-overlay-layout-description
    value: pptmaker-framed-header-overlay-layout-description
    field: schema
    anchors:
      - scripts/03-framed-image/internal
  - name: framed-header-overlay-render-profile
    value: pptmaker-framed-header-overlay-render-profile
    field: schema
    anchors:
      - scripts/03-framed-image/internal/framed_render_profile.mjs
  - name: html-font-inventory
    value: pptmaker-html-font-inventory
    field: schema
    anchors:
      - scripts/00-setup/internal

wire_schema_groups:
  - stage_ref: visual-language
    role: visual-system-source
    values:
      - pptmaker-page-image-visual-language
      - pptmaker-image2-reference-registry
      - pptmaker-pure-deck-visual-system
      - page-image-visual-clause
  - stage_ref: page-source-receipt
    role: parsed-source
    values:
      - page-image-workflow-source
      - page-image-invalidation
      - page-image-target-structural-plan
      - page-image-target-refresh-route
  - stage_ref: page-generation-spec
    role: compiled-page-facts
    values:
      - page-image-core-facts
      - page-image-core-slide-facts
  - stage_ref: image2-request
    role: provider-input
    values:
      - page-image-compiled-provider-input
      - page-image-provider-input
      - page-image-framed-provider-input
      - page-image-pure-provider-input
      - page-image-target-raw-provider-request
      - page-image-provider-request-inspection
      - page-image-style-master-provider-brief
      - page-image-style-master-provider-request
  - stage_ref: image-generation-plan
    role: generation-planning
