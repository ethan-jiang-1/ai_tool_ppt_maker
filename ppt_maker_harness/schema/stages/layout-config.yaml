schema: layout-config
kind: source
scope: version
purpose: "Resolve a closed page class into isolated framed or pure presentation profiles with inheritance provenance."
answers: "Which class and workflow-specific profile govern this page's presentation treatment?"
owner: "scripts/shared/run-bundle/bundle_layout.mjs (locations and seeds); scripts/02-visual-system/internal/page_image_presentation.mjs (validation and resolution)"
producer_status: materialized
inputs:
  - page-source
  - version visual-style/page-image-presentation source package
outputs:
  - in-memory page-layout projection
provenance:
  source: "Override-first/backbone-default page-class catalog, deck defaults, Pure profiles, and Framed header profiles."
  requirement: "Validate all four source contracts before resolution; bind each page only to its selected class/profile/default values and their provenance."
downstream_consumers:
  - page-layout
  - page-generation-spec
  - image-generation-plan
does_not_contain:
  - "Per-page copy, a provider prompt, or provider transport bytes."
  - "A shared profile that mixes Pure facts with Framed header facts, a generated projection, or lifecycle evidence."
fields:
  page_class:
    type: enum
    description: "The page treatment selected from the version's class catalog."
    rule: "Must be standard, opening, transition, or closing when supplied."
    default: standard
    on_violation:
      means: "The selected source class cannot be resolved from the closed package."
      ask: "Repair the Page Source or the direct package record, then rerun the same resolution checkpoint."
      never: "Never synthesize a profile, merge package YAML, or borrow the other workflow's facts."
  class_profile_binding:
    type: workflow-specific profile reference
    description: "The selected class-to-profile binding for the version workflow."
    rule: "Must resolve each selected class to exactly one profile for the selected workflow."
    on_violation:
      means: "The complete package is missing, malformed, or cross-file inconsistent."
      ask: "Repair the named canonical source document and rerun resolution."
      never: "Never fall back to a previous plan, generated value, or unselected sibling profile."
  inherited_value_provenance:
    type: mapping
    description: "The source of each deck default or class-specific override in the resolved profile."
    rule: "Must identify the deck default or selected profile that supplied every resolved value."
    on_violation:
      means: "A selected input cannot be attributed for invalidation or review lineage."
      ask: "Repair the direct package source supplying the selected binding."
      never: "Never expose an unexplained page override or persist a C5 derived projection."
  framed_header_region:
    type: CSS-pixel rectangle
    description: "The one selected Framed profile header region for deterministic local overlay rendering."
    rule: "For Framed, must contain exactly x, y, width, and height, stay in the selected canvas, contain every permitted local header field, and leave positive canvas height below it."
    on_violation:
      means: "The selected Framed profile cannot define one attributable local header treatment."
      ask: "Repair the selected Framed profile's one header region and its permitted field rectangles."
      never: "Never accept protected_geometry, multiple regions, a per-page override, or a generated-layout fallback."
  framed_protected_composition:
    type: normalized-canvas mapping
    description: "The resolver-derived reserved-header and full-width body-safe guidance from the selected Framed header region."
    rule: "For Framed, reserved_header must normalize header_region and body_safe must equal x 0, y reserved_header.y plus height, width 1, and height 1 minus that bottom edge; provenance must identify the selected profile and inherited values."
    on_violation:
      means: "The selected profile cannot produce one exact provider-facing composition lineage."
      ask: "Repair the selected profile or its declared canvas, then rerun the same resolution checkpoint."
      never: "Never infer composition from a slide, C5 output, prior plan, or Pure projection."
