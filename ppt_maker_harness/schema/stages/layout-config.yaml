schema: layout-config
kind: source
scope: version
purpose: "Resolve a closed page class into isolated framed or pure presentation profiles with inheritance provenance, an optional shared Page Design System source binding, and one owner-declared Image2 capability source."
answers: "Which class and workflow-specific profile govern this page's presentation treatment, which shared provider-design text is selected, and which non-secret Image2 operation capability is available?"
owner: "scripts/shared/run-bundle/bundle_layout.mjs (locations and seeds); scripts/02-visual-system/internal/page_image_presentation.mjs (presentation validation and resolution); scripts/02-visual-system/internal/page_design_system.mjs (opaque shared design-system binding); scripts/shared/image2/provider_profile.mjs (confined Image2 capability resolution)"
producer_status: materialized
inputs:
  - page-source
  - version visual-style/page-image-presentation source package
  - optional version-resolved visual-style/page-design-system.md source
  - override-first image2-provider-profile.yaml source
outputs:
  - in-memory page-layout projection
  - in-memory page-image-design-system-binding
  - in-memory image2-provider-profile binding
provenance:
  source: "Override-first/backbone-default page-class catalog, deck defaults, Pure profiles, Framed header profiles, optional opaque Page Design System prose, and the selected Image2 provider profile."
  requirement: "Validate all four presentation source contracts before class resolution; bind each page only to its selected class/profile/default values and their provenance. Resolve the optional Page Design System as a separate local text/digest binding and the selected Image2 profile as a path-free capability binding."
downstream_consumers:
  - page-layout
  - page-generation-spec
  - image-generation-plan
does_not_contain:
  - "Per-page copy, a provider prompt, or provider transport bytes."
  - "A shared profile that mixes Pure facts with Framed header facts, a generated projection, or lifecycle evidence."
  - "A provider-facing path, selection origin, authorization, review, or lifecycle fact for the Page Design System."
  - "Image2 credentials, API keys, base URLs, provider responses, State capability facts, or an authorization record."
fields:
  page_class:
    type: enum
    description: "The page treatment selected from the version's class catalog."
    rule: "Must be standard, opening, transition, or closing when supplied."
    default: standard
    on_violation:
      means: "The selected source class cannot be resolved from the closed package."
      ask: "Repair the Page Source or the direct package record, then rerun the same resolution checkpoint."
      never: "Never synthesize a profile, merge package YAML, or borrow the other workflow's facts."
  class_profile_binding:
    type: workflow-specific profile reference
    description: "The selected class-to-profile binding for the version workflow."
    rule: "Must resolve each selected class to exactly one profile for the selected workflow."
    on_violation:
      means: "The complete package is missing, malformed, or cross-file inconsistent."
      ask: "Repair the named canonical source document and rerun resolution."
      never: "Never fall back to a previous plan, generated value, or unselected sibling profile."
  inherited_value_provenance:
    type: mapping
    description: "The source of each deck default or class-specific override in the resolved profile."
    rule: "Must identify the deck default or selected profile that supplied every resolved value."
    on_violation:
      means: "A selected input cannot be attributed for invalidation or review lineage."
      ask: "Repair the direct package source supplying the selected binding."
      never: "Never expose an unexplained page override or persist a derived projection."
  framed_header_region:
    type: CSS-pixel rectangle
    description: "The one selected Framed profile header region for deterministic local overlay rendering."
    rule: "For Framed, must contain exactly x, y, width, and height, stay in the selected canvas, contain every permitted local header field, and leave positive canvas height below it."
    on_violation:
      means: "The selected Framed profile cannot define one attributable local header treatment."
      ask: "Repair the selected Framed profile's one header region and its permitted field rectangles."
      never: "Never accept protected_geometry, multiple regions, a per-page override, or a generated-layout fallback."
  framed_protected_composition:
    type: normalized-canvas mapping
    description: "The resolver-derived reserved-header and full-width body-safe guidance from the selected Framed header region."
    rule: "For Framed, reserved_header must normalize header_region and body_safe must equal x 0, y reserved_header.y plus height, width 1, and height 1 minus that bottom edge; provenance must identify the selected profile and inherited values."
    on_violation:
      means: "The selected profile cannot produce one exact provider-facing composition lineage."
      ask: "Repair the selected profile or its declared canvas, then rerun the same resolution checkpoint."
      never: "Never infer composition from a slide, derived output, prior plan, or Pure projection."
  page_design_system_binding:
    type: "local page-image-design-system-binding: { schema, text, sha256 }"
    description: "One immutable optional opaque UTF-8 design-system source binding shared by Pure and Framed adapters."
    rule: "The selected override-first source is a regular confined file. Its exact nonblank text and lowercase SHA-256 appear together, or both text and sha256 are null; its source bytes are at most 8192 before UTF-8 decoding."
    on_violation:
      means: "The selected shared provider-design source is unsafe, malformed, or cannot be attributed exactly."
      ask: "Repair the selected page-design-system.md source and rerun the same provider-free planning checkpoint."
      never: "Never parse prose as a visual-language record, fall back from an invalid existing override, use a generated or historical value, or expose source path/origin to a provider."
  image2_provider_profile_binding:
    type: path-free confirmed capability mapping
    description: "One immutable owner-declared Image2 profile binding with exactly Style Master text generation and Page Image reference generation operations."
    rule: "The selected override or backbone source must be a confined direct YAML profile with confirmed deck-author declaration, lower-kebab profile and endpoint identities, both closed operation names, and a positive ordinary limit plus one closed count unit for each operation."
    on_violation:
      means: "The provider route capability cannot be attributed before planning."
      ask: "Repair the owner-declared image2-provider-profile.yaml source, then rerun the same provider-free checkpoint."
      never: "Never infer a profile from credentials, base URL, model alias, inspection, State, a prior plan, or a provider response."
