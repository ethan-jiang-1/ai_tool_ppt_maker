schema: story-outline
kind: source
scope: deck
purpose: "Record the deck's Block-first argument, evidence order, and intended audience outcome before pages are derived."
answers: "What is the argument, in what Block order, and on what evidence?"
owner: "ppt_maker_harness/scripts/01-content/internal/narrative_source.mjs"
producer_status: materialized
inputs: []
outputs:
  - page-source
provenance:
  source: "Human-authored deck narrative."
  recomputable: false
  requirement: "Keep the author decision and its evidence references together."
downstream_consumers:
  - page-source
does_not_contain:
  - "Per-page visual selections or provider instructions."
  - "A review decision, generated image, or delivery receipt."
fields:
  central_claim:
    type: string
    description: "The conclusion the audience should retain."
    rule: "Must state one testable deck-level claim."
    on_violation:
      means: "The deck has no clear conclusion to organize around."
      ask: "What should the audience believe or do after this presentation?"
      never: "Never infer the central claim from a final image or delivery receipt."
  blocks:
    type: ordered Block list
    description: "Ordered argument Blocks, each with an audience question, argument function, evidence or reasoning beats, and intended inclusive page range."
    rule: "Block ordinals start at 1 and are consecutive; each Block has at least one beat and a positive ascending page range."
    on_violation:
      means: "The argument cannot yet show how its evidence builds toward the conclusion."
      ask: "For each part of the argument, what question does the audience need answered, and which evidence should answer it?"
      never: "Never use page order alone as evidence of an intended argument or infer a page grouping."
  audience_outcome:
    type: string
    description: "The intended audience understanding, decision, or next action."
    rule: "Must describe an outcome for the named audience."
    on_violation:
      means: "The presentation has no stated effect on its audience."
      ask: "What should this audience understand, decide, or do next?"
      never: "Never replace the intended outcome with a rendering preference."
