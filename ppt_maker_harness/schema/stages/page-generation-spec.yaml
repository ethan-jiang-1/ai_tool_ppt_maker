schema: page-generation-spec
kind: derived
scope: version-page
purpose: "Compile normalized page semantics into the workflow-neutral facts from which one adapter prepares a provider request."
answers: "What generation facts must the selected workflow apply to this page?"
owner: "scripts/shared/image2/page_derived_data.mjs materializes Page Image Core facts"
producer_status: materialized
publication:
  role: compiled-page-facts
  current_producer: scripts/shared/image2/page_derived_data.mjs
  workflow_presence:
    framed: required
    pure: required
inputs:
  - page-source-receipt
  - page-layout
  - visual-language
  - page-image-design-system-binding
outputs:
  - image2-request
  - image-generation-plan
provenance:
  source: "The normalized source receipt, selected visual language, generation profile, style-master selection, resolved layout, and optional Page Design System binding."
  requirement: "Retain canonical semantic digests for the page facts, all selected configuration, the nullable Page Design System digest, and the Core binding copied into the derived publication."
downstream_consumers:
  - image2-request
  - image-generation-plan
does_not_contain:
  - "page-render-model or a human-reviewable complete page representation."
  - "Provider response bytes, an authorization, or a review decision."
fields:
  workflow:
    type: enum
    description: "The adapter family that will compile the page's provider-visible request."
    rule: "Must be framed or pure and must match the normalized source receipt."
    on_violation:
      means: "The page's generation facts do not match its selected production treatment."
      ask: "Which workflow was selected for this version's page generation?"
      never: "Never switch workflow while translating a page into generation facts."
  canonical_semantic_digest:
    type: sha256 digest
    description: "The canonical digest binding content, visual, profile, and layout semantics for one page."
    rule: "Must be derived from the complete normalized page semantics."
    on_violation:
      means: "The next generation step cannot prove which page facts it is using."
      ask: "Which reviewed page choices should this generation step preserve?"
      never: "Never reuse a digest after changing a page's content or presentation."
  configuration_bindings:
    type: mapping
    description: "Digests for selected visual, style, generation-profile, header-policy, and workflow configuration."
    rule: "Must bind the configuration actually selected for this page and workflow."
    on_violation:
      means: "The provider instruction could be compiled from unrelated configuration."
      ask: "Which approved visual and presentation choices should this page use?"
      never: "Never bind unselected sibling configuration to the page."
  page_design_system_sha256:
    type: nullable sha256 digest
    description: "The digest of the selected shared Page Design System text, or null when the optional source is absent or blank."
    rule: "Must exactly match the selected adapter raw contract and ordinary/progressive plan binding for both workflows."
    on_violation:
      means: "The page semantics cannot prove which shared provider-design source they compile from."
      ask: "Repair the selected page-design-system.md source or its direct resolver binding, then rebuild the current raw plan."
      never: "Never read prose from a provider request, borrow a previous digest, or treat a null/non-null transition as style-only refresh."
