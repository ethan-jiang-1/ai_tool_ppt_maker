schema: design-constraints
kind: source
scope: deck
purpose: "Capture audience, tone, claim boundaries, and terminology that constrain every derived page."
answers: "What may this deck claim, how should it speak, and what terms must it use?"
owner: "ppt_maker_harness/scripts/01-content/internal/narrative_source.mjs"
producer_status: materialized
inputs: []
outputs:
  - page-source
provenance:
  source: "Human-authored deck brief and content policy."
  recomputable: false
  requirement: "Preserve the author decision that constrained later content."
downstream_consumers:
  - page-source
does_not_contain:
  - "A Visual Language selection, page class, layout or geometry rule, density policy, prompt, or provider request."
  - "A final review decision or a delivery record."
fields:
  audience:
    type: string
    description: "The people whose context and decisions the deck addresses."
    rule: "Must identify the intended audience well enough to guide tone and evidence."
    on_violation:
      means: "The deck cannot choose an appropriate level of detail or tone."
      ask: "Who will use this presentation, and what do they already know?"
      never: "Never substitute a visual style for an audience decision."
  language_and_tone:
    type: string
    description: "The language, register, and evidence standard for the deck."
    rule: "Must give the author enough content direction to write consistently without selecting a visual treatment."
    on_violation:
      means: "The deck may switch voice or evidence standard from one page to the next."
      ask: "What language, register, and evidence standard should every page use?"
      never: "Never turn tone guidance into a Visual Language selection or layout rule."
  forbidden_claims:
    type: list of strings
    description: "Claims, implications, or assurances the deck must not make."
    rule: "Must preserve any known claim boundaries from the content owner."
    on_violation:
      means: "The presentation may overstate what its evidence supports."
      ask: "Which promises, comparisons, or conclusions must this deck avoid?"
      never: "Never treat an omitted warning as permission to make a stronger claim."
  required_terminology:
    type: list of strings
    description: "Terms that must remain consistent in the deck's content."
    rule: "Must use the content owner's approved terminology when terminology is specified."
    on_violation:
      means: "The deck could use conflicting language for the same idea."
      ask: "Which names or phrases must remain exact for this audience?"
      never: "Never replace an approved term with a stylistic synonym."
