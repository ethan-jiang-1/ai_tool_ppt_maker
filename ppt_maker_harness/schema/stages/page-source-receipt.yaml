schema: page-source-receipt
kind: derived
scope: version-page
purpose: "Preserve the normalized result of parsing the authored page source before adapter compilation."
answers: "What did the parser understand from this page's source?"
owner: "scripts/shared/image2/page_derived_data.mjs materializes parser-owned facts"
producer_status: materialized
publication:
  role: parsed-source
  current_producer: scripts/shared/image2/page_derived_data.mjs
  workflow_presence:
    framed: required
    pure: required
inputs:
  - page-source
  - visual-language
outputs:
  - page-layout
  - page-generation-spec
  - page-artifact-index
provenance:
  source: "Page source digest and the visual-language selection used during parsing."
  requirement: "Retain source_sha256, workflow, stable page identity, normalized page facts, and the parser binding that produced the derived publication."
downstream_consumers:
  - page-layout
  - page-generation-spec
  - image-generation-plan
does_not_contain:
  - "A resolved class profile, provider request bytes, or generated image."
  - "An authorization, review decision, or delivery receipt."
fields:
  source_digest:
    type: sha256 digest
    description: "The digest of the authored page source used for parsing."
    rule: "Must identify the exact source bytes that produced the receipt."
    on_violation:
      means: "The parsed page cannot be traced back to the content that was reviewed."
      ask: "Which current source version should this page be derived from?"
      never: "Never reuse a receipt after changing its underlying content."
  normalized_workflow:
    type: enum
    description: "The selected version workflow after source parsing."
    rule: "Must be framed or pure and match the version's recorded workflow."
    on_violation:
      means: "The parsed page is not aligned with the version's production choice."
      ask: "Which workflow was selected for this version before planning work?"
      never: "Never let a page silently change the version's workflow."
  parsed_page_facts:
    type: mapping
    description: "Normalized content, visual selection, header policy, and identity facts for one page."
    rule: "Must preserve one stable page identity and one normalized visual selection."
    on_violation:
      means: "The parser did not produce a complete page that later work can trace."
      ask: "Which content and approved visual selection belong to this page?"
      never: "Never replace parsed facts with a generated image description."
  subject_restrictions:
    type: closed enum
    description: "The parser-owned normalized visual subject restriction shared by both workflows."
    rule: "Must be exactly none, no-generic-metal-robot, or no-identity-subject; an omitted authored value normalizes to none before receipt publication."
    default: none
    on_violation:
      means: "The page has no declared current subject-restriction fact that downstream owners can bind."
      ask: "Choose the supported subject restriction that describes the intended page visual."
      never: "Never infer a restriction from a prior request, generated page, or workflow-specific fallback."
