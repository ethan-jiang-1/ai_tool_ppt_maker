schema: image-generation-record
kind: record
scope: version-page
purpose: "Preserve append-only evidence of a provider generation attempt, its materialization, and its exact lineage."
answers: "What was actually generated for this page, under which exact plan and at what cost?"
owner: "ppt_maker_harness/scripts/shared/image2/page_image_progressive_schema.mjs"
producer_status: materialized
inputs:
  - image-generation-plan
  - image2-request
outputs:
  - page-review-decision
  - final-page-list
provenance:
  source: "A provider request digest, exact plan and batch identities, attempt identity, and materialization provenance."
  requirement: "Records are append-only evidence and use the current serialized identifiers declared in serialization-contracts.yaml."
downstream_consumers:
  - complete-page-review
  - final-page-list
  - delivery-package
does_not_contain:
  - "A mutable replacement for the source or generation plan."
  - "An implied acceptance or delivery decision."
fields:
  attempt_identity:
    type: digest and idempotency key
    description: "The identity that binds one provider attempt to one page, plan, batch, and raw contract."
    rule: "Must match the exact page, plan, batch, and request lineage used for the attempt."
    on_violation:
      means: "The paid attempt cannot be distinguished from another submission."
      ask: "Which exact planned page and request did this attempt submit?"
      never: "Never reuse an attempt identity for changed request bytes."
  attempt_status:
    type: enum
    description: "The recorded lifecycle result of the provider attempt."
    rule: "Must be one supported attempt status and may advance only through valid recorded transitions."
    on_violation:
      means: "The record cannot say whether a provider charge or usable result occurred."
      ask: "What is known about this submission right now?"
      never: "Never rewrite a terminal attempt to hide a failed or unknown outcome."
  materialization_provenance:
    type: mapping
    description: "Digests connecting the stored raw bytes to the plan, grant, request, and attempt."
    rule: "Must identify the exact evidence chain for every stored provider result."
    on_violation:
      means: "The generated bytes cannot prove where they came from."
      ask: "Which plan, request, and attempt produced these bytes?"
      never: "Never treat copied bytes as new generation evidence."
