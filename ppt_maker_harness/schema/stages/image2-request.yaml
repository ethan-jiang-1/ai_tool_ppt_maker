schema: image2-request
kind: derived
scope: version-page
purpose: "Represent the exact canonical request bytes prepared for the selected image provider."
answers: "What exact bytes will image2 receive for this page?"
owner: "scripts/shared/image2/page_derived_data.mjs materializes selected adapter bytes"
producer_status: materialized
publication:
  role: provider-input
  current_producer: scripts/shared/image2/page_derived_data.mjs
  workflow_presence:
    framed: required
    pure: required
inputs:
  - page-generation-spec
outputs:
  - image-generation-plan
  - image-generation-record
provenance:
  source: "One selected adapter's compiled provider input and its binding to core page facts, including the optional shared Page Design System digest."
  requirement: "Retain the canonical UTF-8 bytes and sha256 digest selected by the adapter for provider submission."
downstream_consumers:
  - image-generation-plan
  - image-generation-record
  - provider-request-inspection
does_not_contain:
  - "A human review decision, delivery artifact, or a replacement source document."
  - "Local Framed header HTML as a duplicate provider payload."
fields:
  canonical_utf8:
    type: UTF-8 bytes
    description: "The exact canonical request serialization prepared by the selected adapter."
    rule: "Must be canonicalized before its digest or submission is used and must not exceed 32768 UTF-8 bytes."
    on_violation:
      means: "The provider request cannot be reproduced or compared reliably."
      ask: "Which approved generation choices should be sent exactly as planned?"
      never: "Never edit a prepared request after its plan has been reviewed."
  request_digest:
    type: sha256 digest
    description: "The digest that binds the submitted bytes to the page generation facts."
    rule: "Must match the canonical request bytes exactly."
    on_violation:
      means: "The recorded submission cannot prove which request it sent."
      ask: "Which planned request should this page submit?"
      never: "Never reuse a request digest for different bytes."
  adapter_binding:
    type: mapping
    description: "The selected adapter's binding to the page semantic, nullable Page Design System, and workflow-specific configuration digests."
    rule: "Must bind the request to one selected page, one selected workflow, and the same nullable Page Design System digest as its raw contract and plan."
    on_violation:
      means: "The request may not belong to the page or workflow being reviewed."
      ask: "Which page and selected production treatment should this request represent?"
      never: "Never submit a request assembled from mixed page treatments."
  design_system:
    type: "string or null"
    description: "The exact selected shared Page Design System prose, or null, supplied only by the selected adapter's raw contract."
    rule: "Both Pure and Framed inputs contain this one top-level text-or-null field. It may not contain a filesystem path, origin, SHA-256, plan identifier, authorization, attempt, review, or lifecycle fact; Framed retains its existing local-header and exclusive-reservation boundary."
    on_violation:
      means: "The provider-facing request leaks local lineage or no longer matches the adapter-bound source text."
      ask: "Repair the selected source binding or adapter contract, then rebuild the provider-free plan."
      never: "Never add a transport-side replacement field, rewrite submitted bytes, or place local Framed header content in this value."
  framed_composition_boundary:
    type: workflow-specific mapping
    description: "The Framed request binding for selected normalized protected composition, parser-owned subject restrictions, and the local-overlay-exclusive header reservation."
    rule: "A Framed request must bind the selected reserved_header and full-width body_safe composition plus subject restrictions. reserved_header is exclusively for the deterministic local kicker/title/subtitle overlay: provider typography, labels, readable body content, and key subjects must remain in body_safe. The request must omit every local_header, header-derived context, protected_geometry, and provider-native region or mask field."
    on_violation:
      means: "The request cannot prove the current local-header/provider boundary or exact Framed raw lineage."
      ask: "Repair the selected source or Framed profile, then rebuild the current provider-free plan."
      never: "Never copy local header literals into the request, reinterpret matching provider content as header context, or add an unverified provider primitive."
