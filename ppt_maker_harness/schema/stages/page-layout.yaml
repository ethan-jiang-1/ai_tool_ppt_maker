schema: page-layout
kind: derived
scope: version-page
purpose: "Represent the workflow-isolated Page Class projection used to compile and inspect one current page."
answers: "Which selected profile and presentation facts bind this page's current raw input, and where did they come from?"
owner: "scripts/shared/image2/page_derived_data.mjs materializes resolver-owned facts"
producer_status: materialized
publication:
  role: resolved-presentation
  current_producer: scripts/shared/image2/page_derived_data.mjs
  workflow_presence:
    framed: required
    pure: required
inputs:
  - page-source-receipt
  - layout-config
  - visual-language
outputs:
  - page-generation-spec
  - image-generation-plan
provenance:
  source: "One normalized Page Source receipt plus its resolved layout-config projection."
  requirement: "Keep normalized class, selected profile, selected defaults, provenance, and binding digest in immutable raw lineage and its read-only C5 publication."
downstream_consumers:
  - page-generation-spec
  - image-generation-plan
does_not_contain:
  - "Provider transport bytes, a provider response, or a review decision."
  - "A second source of record for the author-authored page content."
fields:
  resolved_class:
    type: enum
    description: "The class after applying the normalized page source and version catalog."
    rule: "Must resolve to exactly one class profile for the selected workflow."
    on_violation:
      means: "The source class and selected workflow have no one valid isolated projection."
      ask: "Repair the direct Page Source or presentation package and rerun the resolver."
      never: "Never merge classes, infer a class, or attach a Pure projection to Framed work."
  geometry:
    type: mapping
    description: "Workflow-specific profile facts: Pure whole-page facts or Framed local header_region and resolver-derived protected_composition facts."
    rule: "Must expose only the selected workflow's facts and identify their source origins; Framed protected_composition must retain normalized-canvas reserved_header and the exact full-width body_safe formula."
    on_violation:
      means: "The selected profile cannot supply deterministic adapter facts."
      ask: "Repair the selected profile source and rerun the same checkpoint."
      never: "Never use protected_geometry, provider media, an unselected sibling, or a caller geometry override as the source."
  provenance_map:
    type: mapping
    description: "A reference from each resolved value to its source, deck default, or selected profile."
    rule: "Must account for every inherited or overridden presentation value."
    on_violation:
      means: "A future change cannot determine what this page needs to rebuild."
      ask: "Where did each page treatment choice come from?"
      never: "Never report a resolved value without its origin."
