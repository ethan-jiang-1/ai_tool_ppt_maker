schema: pptmaker-page-image-visual-language
recipes:
  editorial-systems:
    provider_clause: sparse decorative sketch accents on cream paper, sepia ink, amber highlights, generous negative space, small marginal marks, fine cross-hatching
    workflows: [framed, pure]
    composition_ids: [minimal, title-pause, centered-constellation, left-to-right-flow, timeline, two-column, three-column, chain, funnel, stack, parallel-chains, confluence, information-rise, evidence-shift]
    motif_ids: [connected-nodes, layered-pathways, soft-grid, flowing-artifacts, shift-connector, decision-path, evidence-cards]
    identity_subject_classes: [none, amber-light-form]
  collaborative-work:
    provider_clause: sparse decorative sketch of shared work, amber light accents, generous negative space, subtle marginal marks
    workflows: [framed, pure]
    composition_ids: [field-of-work, hub-spoke, two-column, stack, centered-constellation, specialist-generalist, framed-workspace]
    motif_ids: [shared-work-surface, connected-nodes, soft-grid, role-contrast, frame-boundary, five-domain-map, readable-schematic]
    identity_subject_classes: [none, amber-light-form]
  org-transform:
    provider_clause: warm editorial sketch of organizational change, cream paper, sepia ink, restrained amber connectors, visible work interfaces, generous negative space, fine cross-hatching
    workflows: [pure]
    composition_ids: [title-pause, centered-constellation, left-to-right-flow, timeline, two-column, three-column, chain, stack, confluence, evidence-shift, specialist-generalist, framed-workspace]
    motif_ids: [fulcrum-lever, verification-rails, responsibility-owner, platform-stack]
    identity_subject_classes: [none, amber-light-form]
compositions:
