    min_motifs: 1
    max_motifs: 2
  evidence-shift:
    provider_clause: two distinct side by side environments, left alpine gathering with tentative light marks, right contemporary workshop with confident organized marks, one broad amber connector crosses center, no continuous border or corner ornament
    workflows: [framed, pure]
    min_motifs: 1
    max_motifs: 2
  specialist-generalist:
    provider_clause: left focused human specialist at a compact desk, right amber light form with varied unmarked work artifacts, warm collaborative contrast with generous separation, no continuous border or corner ornament
    workflows: [framed, pure]
    min_motifs: 2
    max_motifs: 3
  framed-workspace:
    provider_clause: large warm translucent rectangular boundary centered in body, one amber light form within two contrasting work zones, one calm human outside touching boundary lightly, generous open reading area, no continuous border or corner ornament
