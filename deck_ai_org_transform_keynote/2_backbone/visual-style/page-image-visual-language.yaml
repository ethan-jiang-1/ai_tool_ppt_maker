    provider_clause: centered focal accent with generous negative space, unmarked surface
    workflows: [framed, pure]
    min_motifs: 0
    max_motifs: 1
  title-pause:
    provider_clause: one small restrained etching at the lower edge or far periphery; leave at least three quarters of the canvas unmarked, including a broad centered upper reading zone and an uncluttered field
    workflows: [framed, pure]
    min_motifs: 0
    max_motifs: 1
  centered-constellation:
    provider_clause: centered focal accent with balanced negative space, unmarked surface
    workflows: [framed, pure]
    min_motifs: 0
    max_motifs: 3
  left-to-right-flow:
    provider_clause: clear left to right movement across an open unmarked field
    workflows: [framed, pure]
    min_motifs: 1
    max_motifs: 3
  field-of-work:
    provider_clause: subtle grounded surface accent, calm depth, unmarked
    workflows: [framed, pure]
    min_motifs: 1
    max_motifs: 3
  timeline:
    provider_clause: clear left to right progression of three sparse stages, open unmarked field
    workflows: [framed, pure]
    min_motifs: 1
    max_motifs: 3
  two-column:
    provider_clause: two balanced side by side panels separated by open space, unmarked
    workflows: [framed, pure]
    min_motifs: 0
    max_motifs: 3
  three-column:
    provider_clause: three balanced side by side panels, clear left to right order
    workflows: [framed, pure]
    min_motifs: 0
    max_motifs: 3
  hub-spoke:
    provider_clause: one central focal accent with sparse radiating connections, generous negative space
    workflows: [framed, pure]
    min_motifs: 1
    max_motifs: 3
  chain:
    provider_clause: horizontal sequence of sparse linked nodes, clear left to right order
    workflows: [framed, pure]
    min_motifs: 1
    max_motifs: 3
  funnel:
    provider_clause: wide opening narrowing to a small focal point, clear downward flow
    workflows: [framed, pure]
    min_motifs: 0
    max_motifs: 2
  stack:
    provider_clause: horizontal bands stacked vertically, clear downward order
    workflows: [framed, pure]
    min_motifs: 1
    max_motifs: 3
  parallel-chains:
    provider_clause: two parallel horizontal sequences with matched spacing
    workflows: [framed, pure]
    min_motifs: 1
    max_motifs: 3
  confluence:
    provider_clause: two sparse streams flowing inward to merge at one focal point
    workflows: [framed, pure]
    min_motifs: 1
    max_motifs: 3
  information-rise:
    provider_clause: large editorial worktable on the right with upward flowing unmarked information artifacts, generous open left reading area, clear visual emphasis, no continuous border or corner ornament
