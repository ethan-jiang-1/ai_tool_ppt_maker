schema: spec-driven

context: |-
  ## 项目本质与所有权

  这是一个 **Markdown-first 的 Agentic PPT workflow**，不是由代码拥有主流程的传统程序。
  Agent 读取 Charter、workflow 与 `playbook/*.md`，理解意图、做创意和路径判断，再调用
  JS/CLI 完成确定性工作并在 Gate 处把控制权交还给 Agent / 人类。

  | 控制面 | 所有权 |
  |--------|--------|
  | MD Controller / Agent | 流程、节点、依赖、路径选择、模糊意图、创意判断与用户交互 |
  | JS / CLI | 解析、校验、自愈、状态、证据、产物转换和结构化诊断；不得定义第二套 playbook |
  | 人类 | 隐喻、主张、案例可信度、视觉与最终内容判断 |

  `playbook/*.md` 是 controller 节点、顺序、entry/exit 与 decision 的事实源；
  `md_controller_reader.mjs` 只负责读取、索引和验证。可确定修复的 YAML/JSON 瑕疵优先由
  精准侧 heal 并写回 canonical form，不把格式问题甩给用户。

  ## 工作域与对象边界

  PPT Maker Harness repository maintenance 只把以下四个目录视为 Harness 源码域：

  | 对象 | 路径 | 角色 |
  |------|------|------|
  | PPT Maker Harness soft bundle | `ppt_maker_harness/` | Charter、方法论、MD Controller 与 Node 工具 |
  | OpenSpec system | `openspec/` | main specs、changes、archive 与项目配置 |
  | Unit / integration tests | `tests/` | 单元测试与跨模块集成测试 |
  | End-to-end tests | `tests_e2e/` | 从公开入口验证完整流程与状态机 |

  做 repository maintenance 时，按 OpenSpec change 修改上述源码域。做具体 deck 时，
  `ppt_maker_harness/` 是只读方法论与工具，不得为某个 deck 顺手修改 Harness。

  - **Run bundle** (`deck_{NAME}/`) 是 Harness 生产和维护的 PPT 项目对象，不是 Harness 源码。
    只有用户明确指定 deck 路径后才进入其中工作。其稳定梯度是：
    `1_upstream_raw_material/` → `2_backbone/` → `3_versions/v{n}/`。
  - `3_versions/v{n}/` 是 `--run-dir`，不是 deck 根；`_generated/` 是可重建派生物，
    `_scratch/` 是版本级临时出口。
  - **Deep research input** (`dpt_*`) 是输入素材，不是 Harness、run bundle 或测试夹具；
    用户未明确指定时不读。
  - `_backlog/` 是独立簿记系统，只有用户明确指定时读取；它不替代 OpenSpec change 状态。

  PPT Maker Harness soft-bundle 结构由 `harness-directory-layout` 管；run bundle 本体论由
  `run-bundle-layout` 管，机器 SSOT 是 `bundle_layout.mjs`。两者不得混称。

  ## 权威源与查找顺序

  | 主题 | 权威源 |
  |------|--------|
  | 项目宪法与 Agent 行为 | `ppt_maker_harness/charter/*.md` |
  | MD Controller 流程 | `ppt_maker_harness/playbook/*.md` |
  | Capability 当前行为 | `openspec/specs/<capability>/spec.md` |
  | 当前 change 增量 | active change 下的 `specs/<capability>/spec.md` |
  | Run-bundle 目录与路径 | `bundle_layout.mjs` + `run-bundle-layout` |
  | CLI diagnostic producer | `cli-surface` |
  | CLI diagnostic consumer / Node state | `node-specification` + `charter/NODE-SPEC.md` |
  | Runtime dependencies | `package.json` |

  修改行为前先读对应 main spec，再读 active delta；不要在 consumer、镜像文档或 config 中
  复制另一 capability 的详细 schema。

  ## 技术栈与运行时铁律

  Node.js 22.x、24.x 或 26.x ESM。主要依赖由 `package.json` 声明：`@napi-rs/canvas`、`pptxgenjs`、
  `jszip`、`commander`、`yaml`；HTTP 使用 Node 内置 `fetch`，测试使用 `vitest`。
  统一入口：`node ppt_maker_harness/scripts/ppt_flow.mjs <command>`。

  | 边界 | 规则 |
  |------|------|
  | 官方运行时 | 所有 Harness 可执行资产使用 Node.js ESM（`.mjs` / 必要的 `.js`）和声明的 npm 依赖 |
  | 绝对禁止的生产依赖 | 不把 Python / `.py` / Pillow / uv / `pyproject.toml`、bash / `.sh` / POSIX-only 管线作为 Harness 生产路径 |
  | Agent skill 边界 | 外部 skill 可以辅助开发 Agent，但不得成为 Harness 冷启动或生产管线的运行时依赖 |
  | 图像与视觉工具 | 图像生成、style master、contact sheet 等正式能力由 `ppt_maker_harness/scripts/` 内的 Node 模块实现 |
  | 文档命令 | shell 代码块只是供人或 Agent 调用 `node …` 的命令示例，不是 `.sh` 可执行资产 |

  详细权威：`charter/CONSTITUTION.md` + `charter/AGENT_CONTRACT.md` §7。

  ## CLI 失败回执

  | 维度 | 规则 |
  |------|------|
  | 适用范围 | PPT Maker Harness 直接暴露的 CLI 发生 JS-controlled non-zero hard failure |
  | 机器回执 | `stderr` 最后一个非空行必须是唯一的单行 JSON envelope，不能只返回散文错误 |
  | 诊断内容 | Diagnostic 必须有版本、范围受限且 secret-safe；只交付 JS 已知的 source/artifact lineage 与安全 `next` |
  | 禁止泄露 | 不释放 raw prose、stack、provider body、prompt、`.env` 内容或未经整理的 child output |
  | Producer | `cli-surface` 定义 CLI 发射字段和规则 |
  | Consumer | `node-specification` / `charter/NODE-SPEC.md` 定义 MD Controller 如何消费回执 |

  Config 只固定协议边界，不复制 producer 或 consumer 的详细 schema。

  ## Capability 注册表

  Capability 是 proposal → delta specs → main specs 的稳定归属边界。名称使用 kebab-case，
  表达长期责任，不使用文件名、实现手段或一次性 change 名。main spec 是规范行为权威；以下
  registry 只提供导航，`scope` 不替代任何 requirement、Controller、CLI 或 schema。

  <!-- harness-capability-registry:start -->
  capabilities:
    - id: bootstrap-env-guidance
      spec: openspec/specs/bootstrap-env-guidance/spec.md
      scope: Bootstrap startup and environment remediation guidance
      owner_paths:
        - ppt_maker_harness/BOOTSTRAP.md
        - ppt_maker_harness/scripts/00-setup/env-check.mjs
    - id: cli-surface
      spec: openspec/specs/cli-surface/spec.md
      scope: registered direct CLI output and diagnostic boundary
      owner_paths:
        - ppt_maker_harness/scripts/ppt_flow.mjs
        - ppt_maker_harness/scripts/shared/cli/cli_error.mjs
    - id: commands-reference
      spec: openspec/specs/commands-reference/spec.md
      scope: human request discovery and owner-aware handoff
      owner_paths:
        - ppt_maker_harness/COMMANDS.md
    - id: content-parsing
      spec: openspec/specs/content-parsing/spec.md
      scope: current Page Image source parsing and receipt inputs
      owner_paths:
        - ppt_maker_harness/scripts/01-content/index.mjs
    - id: diagnostic-facts
      spec: openspec/specs/diagnostic-facts/spec.md
      scope: internal source/config problem-fact contract shared by producers, aggregators, and operation owners
      owner_paths:
        - ppt_maker_harness/scripts/shared/diagnostic/problem_fact.mjs
    - id: environment-check
      spec: openspec/specs/environment-check/spec.md
      scope: local Harness readiness checks
      owner_paths:
        - ppt_maker_harness/scripts/00-setup/env-check.mjs
    - id: harness-charter
      spec: openspec/specs/harness-charter/spec.md
      scope: active guidance and Harness-wide ownership boundaries
      owner_paths:
        - ppt_maker_harness/charter/AGENT_CONTRACT.md
        - ppt_maker_harness/BOOTSTRAP.md
    - id: harness-directory-layout
      spec: openspec/specs/harness-directory-layout/spec.md
      scope: Harness source map and ownership topology
      owner_paths:
        - ppt_maker_harness/README.md
    - id: harness-script-layout
      spec: openspec/specs/harness-script-layout/spec.md
      scope: script seams, imports, and architecture verification
      owner_paths:
        - ppt_maker_harness/scripts/contracts/harness_architecture.mjs
    - id: html-render-runtime
      spec: openspec/specs/html-render-runtime/spec.md
      scope: retained private Framed header-overlay runtime boundary
      owner_paths:
        - ppt_maker_harness/workflow/03-framed-image/README.md
    - id: image-generation
      spec: openspec/specs/image-generation/spec.md
      scope: receipt-bound Page Image raw generation and review
      owner_paths:
        - ppt_maker_harness/scripts/03-framed-image/index.mjs
        - ppt_maker_harness/scripts/04-pure-image/index.mjs
    - id: image-production
      spec: openspec/specs/image-production/spec.md
      scope: active whole-page Page Image production family
      owner_paths:
        - ppt_maker_harness/AGENTS.md
    - id: image2-lab
      spec: openspec/specs/image2-lab/spec.md
      scope: Image2 Lab discovery CLI, _lab workspace, and unconfirmed Call Shape trials
      owner_paths:
        - ppt_maker_harness/scripts/shared/image2/lab_cli.mjs
        - ppt_maker_harness/playbook/image2-lab.md
    - id: lessons-management
      spec: openspec/specs/lessons-management/spec.md
      scope: run-bundle local lessons command surface
      owner_paths:
        - ppt_maker_harness/scripts/shared/run-bundle/lessons.mjs
    - id: narrative-authoring
      spec: openspec/specs/narrative-authoring/spec.md
      scope: deck-level narrative sources and page planning
      owner_paths:
        - ppt_maker_harness/scripts/01-content/index.mjs
    - id: node-specification
      spec: openspec/specs/node-specification/spec.md
      scope: Controller node and state contract
      owner_paths:
        - ppt_maker_harness/charter/NODE-SPEC.md
        - ppt_maker_harness/scripts/shared/state/state.mjs
    - id: notes-injection
      spec: openspec/specs/notes-injection/spec.md
      scope: receipt-bound speaker-note delivery
      owner_paths:
        - ppt_maker_harness/scripts/05-delivery/index.mjs
    - id: pipeline-orchestration
      spec: openspec/specs/pipeline-orchestration/spec.md
      scope: public Page Image operation routing
      owner_paths:
        - ppt_maker_harness/scripts/ppt_flow.mjs
    - id: playbook-execution
      spec: openspec/specs/playbook-execution/spec.md
      scope: MD Controller playbooks and execution state
      owner_paths:
        - ppt_maker_harness/playbook/create-deck.md
        - ppt_maker_harness/scripts/shared/state/md_controller_reader.mjs
    - id: pptx-assembly
      spec: openspec/specs/pptx-assembly/spec.md
      scope: final-manifest PPTX assembly
      owner_paths:
        - ppt_maker_harness/scripts/05-delivery/index.mjs
    - id: production-schema-conformance
      spec: openspec/specs/production-schema-conformance/spec.md
      scope: current production serialization contract
      owner_paths:
        - ppt_maker_harness/schema/serialization-contracts.yaml
    - id: run-bundle-layout
      spec: openspec/specs/run-bundle-layout/spec.md
      scope: run-bundle directory ontology and paths
      owner_paths:
        - ppt_maker_harness/scripts/shared/run-bundle/bundle_layout.mjs
    - id: run-bundle-management
      spec: openspec/specs/run-bundle-management/spec.md
      scope: run-bundle creation, validation, and binding
      owner_paths:
        - ppt_maker_harness/scripts/shared/run-bundle/bundle_layout.mjs
    - id: slide-identity-and-ordering
      spec: openspec/specs/slide-identity-and-ordering/spec.md
      scope: stable slide identity and derived order
      owner_paths:
        - ppt_maker_harness/scripts/01-content/index.mjs
    - id: style-master-generation
      spec: openspec/specs/style-master-generation/spec.md
      scope: visual-style primitives and raw profiles
      owner_paths:
        - ppt_maker_harness/scripts/02-visual-system/index.mjs
    - id: visual-asset-management
      spec: openspec/specs/visual-asset-management/spec.md
      scope: reference registry paths and fingerprints
      owner_paths:
        - ppt_maker_harness/scripts/02-visual-system/index.mjs
    - id: visual-config
      spec: openspec/specs/visual-config/spec.md
      scope: visual-language and Framed header policy inputs
      owner_paths:
        - ppt_maker_harness/schema/stages/visual-language.yaml
    - id: workflow-inspection
      spec: openspec/specs/workflow-inspection/spec.md
      scope: read-only current workflow observation
      owner_paths:
        - ppt_maker_harness/scripts/shared/workflow/inspect_workflow.mjs
  <!-- harness-capability-registry:end -->

  ## Workflow 术语与生产语义

  `page-image-workflow` 是唯一当前 production pipeline；版本在 provider work 前选择
  `production.workflow: framed|pure`。Method Module 目录和 MD Controller guidance 负责
  方法与流程导航，不创建第二个 pipeline 或 workflow value。Gate、receipt、review、delivery
  的具体条件仍由对应 main spec、Controller 与 runtime owner 定义。

  编辑按实际 owner 和失效范围进入 `Header Text & Style Refresh`、`Generated Image Rebuild`、
  `Notes-Only Refresh` 或 `Structural Versioning Path`。结构变更先经过 preview 和 exact plan
  hash；`_generated/` 永远经由拥有它的 source 和 capability 重建，不手工编辑。

  ## Agent 入口与 OpenSpec 开发循环

  做具体 PPT：`BOOTSTRAP.md` → `charter/AGENT_CONTRACT.md` → 适用的 current Controller guidance。
  已有 deck 先读 `_state` / status，聊天上下文不是进度真相；视觉 Gate 前必须展示真实产物。

  PPT Maker Harness maintenance：proposal → specs → design → tasks → apply → validate → archive。
  - Proposal 保存 WHY、范围和 capability 合同。
  - Specs 定义 capability 的可测试 WHAT。
  - Design 记录 HOW、关键取舍、迁移与验证策略。
  - Tasks 把 specs/design 完整转成可跟踪实施清单。


rules:
  proposal:
    - >-
      Proposal 的首要职责是保存能够支撑后续 Design 的来龙去脉：除了“要什么、为什么要”，
      还要用简洁但足够的上下文说明当前状态、前置决策、触发问题、为什么选择这个方向、
      关键约束、期望结果和范围边界，使后续或并行 Agent 不依赖聊天记录也能理解方案如何形成。
    - >-
      Capabilities 是 proposal 与 delta specs 的合同。先检查 openspec/specs/ 并优先复用已有、
      职责稳定的 capability；只有现有 capability 都不拥有新行为时才新增，并使用长期责任型
      kebab-case 名称。
    - >-
      New Capabilities 与 Modified Capabilities 必须准确：只有 requirement-level 行为变化才列入；
      纯实现、测试或文案调整不得伪装成 capability 变化。
    - >-
      本 repo 的 OpenSpec 只处理 PPT Maker Harness maintenance。Proposal 必须列出受影响的 Harness
      源码范围（ppt_maker_harness/、openspec/、tests/、tests_e2e/）、control owner
      （MD、JS 或 MD⇔JS protocol），并评估对 run-bundle contract 的 impact：
      `none` / `compatible` / `migration`。不得把 production `deck_*` 当源码、fixture
      或待自动迁移对象。指定 deck 的制作从 `BOOTSTRAP.md`、`AGENT_CONTRACT.md` 和
      controller playbook 进入，不经 OpenSpec proposal。
    - >-
      涉及 gate、readiness、validation、diagnostic 或 override 时，必须引用
      `openspec/policies/human-centered-gates.md`，说明 guide/confirm/hard-stop 结果、
      confirm 所需的人类原因，以及每个 hard-stop 保护的不变量；不得复制 runtime schema。
    - >-
      涉及 controller handoff、Agent 自动执行、state/recovery、deterministic check 或 diagnostic
      control path 时，必须引用 `openspec/policies/agent-assistance-and-control.md`：说明直接
      authority、真正需要人类的最小决定、Agent 可继续执行的机械工作，以及避免或合并的重复控制。
    - >-
      涉及任何新的或修改后的质量控制路径时，必须引用
      `openspec/policies/simple-reliable-control.md`：说明最短正确闭环、前置失败短路、唯一最近动作、
      以及新增 blocking rule/state/validator/retry/fallback/recovery 所删除或合并的复杂度；
      无法说明净简化时应缩 scope 或降为 advisory。

  specs:
    - >-
      每个 delta spec 必须使用 proposal 中的准确 capability 名称，并放在
      specs/<capability>/spec.md；ADDED、MODIFIED、REMOVED、RENAMED 必须归入真正拥有该行为的
      capability，不能为了省事塞进相邻 capability。
    - >-
      优先扩展现有 capability。新增 capability 前确认它不是已有 capability 的实现细节、文件名、
      测试名或一次性 change 名，并确保其责任边界可长期复用。
    - >-
      Requirement 必须定义可观察、可测试的 WHAT，并通过场景明确行为所有者：MD Controller / Agent
      负责意图和路径判断，JS / CLI 负责确定性契约、证据与诊断；跨 capability 时引用权威，
      不复制 producer schema。
    - >-
      MODIFIED requirement 必须保留完整更新后的 requirement 和全部仍有效场景；REMOVED 必须写明
      Reason 与 Migration。Delta 必须足以在 archive 时安全同步到 main specs，不依赖聊天补全。
    - >-
      目录、source/derived 等领域术语必须使用本 context 的 canonical 含义；
      harness-directory-layout 与 run-bundle-layout 不得混称。
    - >-
      Gate-sensitive requirement 必须区分可自动修复的 guide、可被 reasoned waiver 继续的
      confirm、以及不可绕过的 hard-stop。waiver 必须保持 version-scoped、可审计，且绝不能
      被表述为 approval 或 evidence-complete。
    - >-
      涉及 deterministic control path 的 requirement 必须指定 owning source of record，并复用
      已有 evaluator 或解释为什么不能复用；前置 authority/identity 失败时必须短路派生症状，
      而非新增 competing pass/fail projection。
    - >-
      质量控制 requirement 必须保持比被验证工作更简单：primary diagnostic 只返回最小可修复根因和
      一个最近合法动作；无法可靠判断时 fail closed 或显式 unknown，不得依赖隐式 fallback。

  design:
    - >-
      Design 解释 HOW 和关键取舍，不重复 proposal 的完整动机或 specs 的规范正文。简单 change 保持
      简洁；跨模块、迁移、状态、协议或新架构模式才展开详细决策。
    - >-
      每个关键决策说明由 MD、JS 或 MD⇔JS protocol 的哪一侧拥有，并给出理由与备选；不得创建与
      playbook/*.md、cli-surface、node-specification 或 bundle_layout.mjs 重复的第二事实源。
    - >-
      Change 只要涉及 Harness 可执行代码，Design 就必须单独思考验证策略：分别评估 unit、
      integration、e2e 是否需要、各自验证哪一层边界以及为什么。不是机械要求三类测试全部增加，
      但不得跳过评估；测试资产优先复用 tests/fixtures 与最小代表性夹具，不把 deck_* 生产数据
      默认为 Harness 测试资产。
    - >-
      涉及兼容、状态或持久化时说明 migration、heal、幂等与回退；涉及生成物时说明失效与重建路径，
      不把手工修改派生产物作为方案。
    - >
      当 change 涉及 gate/readiness/validation/diagnostic/override 时，读取
      `openspec/policies/human-centered-gates.md`；在 design 说明每种结果的
      guide/confirm/hard-stop 分类、protected invariant、确认记录 owner 和 hard-stop 的合法恢复。
      不得把 force/waive 设计成跨越 identity、integrity、security、authorization 或 recovery 边界。
    - >
      当 change 涉及 controller handoff、Agent 自动执行、state/recovery、deterministic check
      或 diagnostic control path 时，读取 `openspec/policies/agent-assistance-and-control.md`；
      说明 direct Source of Record、evaluator、human/Agent/runtime responsibility、writer/reader、
      失效规则与同一 checkpoint 的最近合法下一动作，不得创建第二 controller 或 authority。
    - >
      当新增或修改 quality-control layer 时，读取
      `openspec/policies/simple-reliable-control.md`；说明 direct fact、现有 checkpoint 的不足、
      删除或合并的逻辑、唯一失败动作和 focused negative test。无法说明 net simplification 时缩 scope
      或降为 advisory。

  tasks:
    - >-
      Tasks 必须完整覆盖所有会影响实现或验收的 delta requirements 与 design decisions；不得为省事
      静默删减。确需延期时，用明确的 deferred task 或说明记录范围和理由。
    - >-
      按依赖顺序拆分：权威 spec / source → MD Controller 或 JS capability → consumer / 镜像文档 →
      tests → validation。任务应小而可验证，但不强制所有 change 按 Pipeline Stage 粒度。
    - >-
      每个任务标注或清楚体现所涉及的 capability，并包含完成判据；实现、迁移、错误路径、文档和测试
      只要被 specs/design 要求，就必须进入清单。
    - >-
      按风险安排 tests/ 中的 unit/integration tests 与 tests_e2e/ 中的端到端测试，不要求脚本与测试
      文件机械一一对应；最终包含 targeted validation、openspec strict validation 和必要的回归测试。
    - >-
      只有 run-bundle production 任务才标注 refresh path、--force-images、--only 或 --new-version；
      任何任务都不得要求手工编辑 _generated/。
    - >-
      Gate-sensitive task 必须包含推荐修复、显式 continuation、hard-stop invariant 和其测试；
      continuation 只能发布 owner-owned version-scoped waiver，不能静默放行或伪造 approval。
    - >-
      修改 deterministic control path 的任务必须包含 focused negative coverage，证明前置失败
      短路、诊断有界、state 不会写错 owner，并验证修复后回到同一 checkpoint。
