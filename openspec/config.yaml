schema: spec-driven

context: |
  ## 项目本质

  这是一个 **Agent 驱动的 PPT 生成系统**.它不是传统程序——没有 Makefile, 没有
  Airflow DAG, 没有 YAML 配置的状态机. **Agent 就是编排器**: 读方法论文档 → 做创意
  判断 → 运行管线 → 响应迭代.

  ## 技术栈

  Node.js 18+ (ESM, `.mjs`). npm 依赖: `@napi-rs/canvas` (图片+字体), `pptxgenjs`
  (PPTX), `jszip` (Stage 5 notes), `commander` (CLI), `yaml` (state.yaml 容错读写). HTTP 用 `fetch` (Node 内置). 测试: `vitest`.
  入口: `node PPTMAKER_FRAMEWORK/scripts/ppt_flow.mjs <command>`.
  环境检查: `node PPTMAKER_FRAMEWORK/scripts/env-check.mjs` (零依赖, 先于 npm install).

  ## 运行时铁律（宪法级 · 不可违反）

  **唯一允许的可执行代码：Node.js ESM。** 绝对禁止把下列任何一项当作生产路径或框架资产：
  - Python / `.py` / Pillow / uv / `pyproject.toml`
  - bash / `.sh` / POSIX-only shell 管线（Windows 会断）
  - 外部 agent skill（`.claude/skills`、`.agents/skills`）作为 Stage 2 / style-master 依赖
  Stage 2、contact sheet、style-master 必须实现在 `PPTMAKER_FRAMEWORK/scripts/` 内。
  文档中的 shell 代码块只是 `node …` 命令示例，不是可执行资产。
  权威条文: `charter/CONSTITUTION.md`（运行时宪法）+ `charter/AGENT_CONTRACT.md` §7。

  **CLI 失败回执（宪法级 · MD Controller 友好）。** 每个 registered direct CLI 的
  JS-controlled non-zero return 必须以唯一末行 envelope 收尾，并提供受版本约束、bounded、
  secret-safe 的 actionable diagnostic：保留 JS 已知的 source/artifact lineage 和安全 next，
  不释放 raw prose、stack、provider body、prompt、`.env` 内容或 child output。
  producer 权威: `openspec/specs/cli-surface/spec.md`；consumer 权威:
  `openspec/specs/node-specification/spec.md` / `charter/NODE-SPEC.md`。此 config 不复制详细 schema。

  ## 两层结构

  - **Soft bundle** (`PPTMAKER_FRAMEWORK/`): 只读的方法论知识库. Agent 从这里学习
    "怎么做", 但不修改它.
  - **Run bundle** (`deck_{NAME}/`): 每个具体 PPT 项目的文件系统实例. Agent 在这里
    执行所有工作. 三层梯度:
    - `1_upstream_raw_material/` — 原始素材 (共享)
    - `2_backbone/` — 主干: 隐喻, 公式, 视觉风格 (共享, 稳定)
    - `3_versions/v{n}/` — 下游增量: slide-specifications, overrides, _generated/

  ## 系统 Capability 注册表

  **这是项目 capability 的命名权威源. 所有 change 的 spec 必须使用以下 kebab-case
  identifier, 不得自创名字.**

  ### 项目基础

  | Capability | 做什么 | 关键脚本 |
  |-----------|--------|---------|
  | `run-bundle-layout` | run bundle (`deck_*`) 目录本体论: 三层树 + 各目录 role + 上严下松梯度 + glossary Where Map 检索索引 | `bundle_layout.mjs` (`renderTree()`) |
  | `run-bundle-management` | run bundle 运维: init scaffold / check 校验 / new-version, enforce `run-bundle-layout` 本体论 (不再自定义目录结构) | `bundle_layout.mjs` |
  | `environment-check` | 零依赖运行时检查 (Node.js>=18, npm, API key, 字体, in-framework Stage 2) | `env-check.mjs` |
  | `project-versioning` | repo 级版本管理：VERSION 文件、VERSION_LOG.md、archive 后 agent 判断 bump 粒度 | `VERSION`, `VERSION_LOG.md` |

  ### 生产管线 (5 Stage)

  | Capability | 做什么 | 关键脚本 |
  |-----------|--------|---------|
  | `content-parsing` | Stage 1: markdown → slide_plan.json + page_prompts + validate_specs | `stage1_build_inputs.mjs` |
  | `image-generation` | Stage 2: 框架内 Node 异步生图 + contact sheet（无外部 skill） | `stage2_generate_images.mjs`, `make_contact_sheet.mjs`, `image_api_client.mjs` |
  | `header-lock` | Stage 3: 确定性文字叠加 (kicker/title/subtitle) | `stage3_lock_headers.mjs` |
  | `pptx-assembly` | Stage 4: 图片 → PPTX 容器 | `stage4_build_pptx.mjs` |
  | `notes-injection` | Stage 5: 演讲备注注入 PPTX notes panel | `stage5_inject_notes.mjs` |

  ### 编排 & 配置

  | Capability | 做什么 | 关键脚本 |
  |-----------|--------|---------|
  | `pipeline-orchestration` | 统一编排 + 三条 refresh path + credential 桥接 | `unified_pipeline.mjs` |
  | `visual-config` | Stage 1/3 共享的 color_palette.json 加载器 | `visual_config.mjs` |

  ### 视觉设计

  | Capability | 做什么 | 关键脚本 |
  |-----------|--------|---------|
  | `style-master-generation` | 从 prompt 生成 style_master.jpg, credential 桥接 | `generate_style_master.mjs` |

  ### 交互层

  | Capability | 做什么 | 关键脚本 |
  |-----------|--------|---------|
  | `cli-surface` | 全部 direct CLI 的诊断 producer/output/delegation 契约；并固定 ppt_flow 的 12 个命令 | `scripts/lib/cli_error.mjs`, `ppt_flow.mjs` |

  ### 执行层

  | Capability | 做什么 | 关键文件 |
  |-----------|--------|---------|
  | `node-specification` | Node 规格宪法——Node 解剖、State Schema、Playbook 规则、CLI⇔MD 协议 | `charter/NODE-SPEC.md` |
  | `playbook-execution` | MD Controller 执行体系——9 个有序 controller + 1 个 shared node，40 个全局唯一 Playbook Node，Entry/Exit Gate，`_state/state.yaml` schema v2 | `playbook/*.md`, `scripts/lib/md_controller_reader.mjs`, `scripts/lib/state.mjs` |

  ## 规范层级与 Agent 工作流程

  Lifecycle Phase 是 `0 → 1/2 → 2.7 → 3 → 4`；Method Module 是 `workflow/00-setup` 到 `workflow/05-iteration`；Pipeline Stage 是生产脚本 1–5；Playbook Node 是 MD Controller 中的执行节点。四者不得混称。

  | Method Module | Lifecycle 位置 | 做什么 | Agent 的角色 |
  |--------------|----------------|--------|-------------|
  | 00 项目初始化 | Phase 0 | 环境检查 + 5 问题 intake + 创建 run bundle | 执行者: 跑 `node ppt_flow.mjs init`, 填模板 |
  | 01 视觉风格 | Phase 2 | 锁定 medium → 选预设 → 生成 style_master.jpg → review | 建议者: 推荐 2-3 个预设, 生成 style master, 迭代到 95%+ |
  | 02 内容设计 | Phase 1 | 隐喻 → 公式 → Block Map → 四层 slide specs | 创作者: 生成隐喻候选, 公式, Block Map, 填充 L1/L2/L4 |
  | 03 图像提示词 | Phase 2.7 | 能力层 (不产生独立文件): 回填 L3 image prompt | 学习者: 内化 5 段式 prompt 结构 |
  | 04 生产管线 | Phase 3 | Pipeline Stage 1–5 从 markdown → PPTX | 执行者: 跑 `node unified_pipeline.mjs`, gate 处停下让人类 review |
  | 05 迭代引擎 | Phase 4 | 分类变更 → 最小化重跑 → 记录 | 判断者: 先判断 Structural Versioning Path，再按内容所有者与 resolved render mode 选择 refresh path |

  ## 核心架构原则

  1. **文件系统即工作流引擎** — 目录表达职责层级，文件 = 交接产物；新版本只复制下游源 delta，`_generated/` 干净重建；git = 审计跟踪.
  2. **Node-only 运行时** — 可执行资产只有 Node ESM；禁止 Python/bash/外部 skill 生产路径
     （见「运行时铁律」与 `charter/CONSTITUTION.md`）。
  3. **CLI 失败必出 actionable diagnostic** — 非零 exit 的唯一末行 envelope 必须把 JS 已知的
     source/artifact lineage 与安全 next 交给 MD；详细 producer 契约只在 `cli-surface`。
  4. **Header-Lock** — AI 画身体 (body 视觉), 代码画标题 (kicker/title/subtitle).
     新 deck 默认 `full-page`；只有显式 opt-in 的 slide 才用 `body+header-lock`，让 AI body 留出 header safe zone 后由代码叠加标题.
  5. **Style Anchoring** — 用参考图传视觉风格, 而非用文字描述. `style_master.jpg`
     是所有图像生成的视觉锚点——每张 slide 生成时作为 reference image 传入.
  6. **源 vs 派生** — `2_backbone/` 和 `slide-specifications.md` 是手编源文件.
     `_generated/` 内一切都可以通过重跑管线重新生成, 绝不手动编辑.

  ## Agent 入口

  1. 关键词触发 → `CLAUDE.md`
  2. `PPTMAKER_FRAMEWORK/BOOTSTRAP.md` — 环境检查 + 5 问题 intake
  3. `PPTMAKER_FRAMEWORK/charter/AGENT_CONTRACT.md` — 11 条铁律 (一页纸, 必读)
  4. `PPTMAKER_FRAMEWORK/AGENTS.md` — 按 Phase 分段读, 不从头到尾读

  ## Refresh Path（变更分类）

  用户只需自然语言描述改动。Agent 先判断是否改变 slide 集合/顺序，再按内容所有者和失效产物选择最小安全路径。英文名是正式检索词；括号内中文只作解释，旧字母只作兼容对照。

  | 正式名称（兼容旧称） | 能改什么 | 逻辑执行 | 耗时 |
  |----------------------|----------|----------|------|
  | Header Text & Style Refresh（页眉文字与样式刷新；formerly Chain A） | resolved `body+header-lock` 的 KICKER/TITLE/SUBTITLE 及 Stage 3 拥有的字体/颜色/位置/间距；raw-image contract 不变 | Stage 1 → 3 → 4 → 5 | ~5 min |
  | Generated Image Rebuild（生成图重建；formerly Chain B） | full-page header、body 文案/数据、image prompt、画面/配色、mode 或 safe-zone 等 raw-image contract | Stage 1 → 强制重生所选 Stage 2 → review → Stage 3/4/5（复用已审图） | ~5 min/页 |
  | Notes-Only Refresh（仅备注刷新；formerly Chain C） | speaker notes | Stage 5 | ~30 sec |
  | Structural Versioning Path（结构版本路径；formerly Structural） | 增/删/重排 slide | `--new-version` → 在新版本按受影响页选择上述 refresh path | 按页数 |

  标题意图统一走 `ppt_flow refresh --kind title`：resolved `body+header-lock` 走 Header Text & Style Refresh，`full-page` 走 Generated Image Rebuild；混合 scope 必须显式给 slide IDs。分类参照: `PPTMAKER_FRAMEWORK/scripts/change-classifier.md`

  ## 核心词汇 (只有这些)

  - RENDER MODE: `full-page` (AI 画整页), `body+header-lock` (AI 画 body, 代码锁标题)
  - 禁用别名: `image_direct`, `normal`——这些已废弃
  - Slide 四层: L1 Meta (视觉类型/标题), L2 Concept (认知载荷),
    L3 Image Prompt (视觉执行指令), L4 Speaker Note (叙述流 60-90s)

  ## 人-Agent 协作边界

  - **Agent 拥有过程**: 目录结构, 管线执行, 变更分类, 文件管理
  - **人类拥有内容**: 隐喻准确度, 案例可信度, 颜色适当性, 核心主张——这些必须由人判断
  - **Gate 是强制停顿点**: `project-metadata.yaml` 中 `content_gate` 和 `visual_gate`
    必须为 `approved` 或 `waived` 才能进入 Stage 2

  ## 与 _backlog 的关系

  `_backlog/` 是独立的簿记系统 (bugs/todos/plans), 有自己基于 `git mv` 的生命周期.
  与 OpenSpec 各自簿记, 不交叉判定. `_` 前缀目录 (`_done/`, `_fixed_bugs/` 等)
  是已归档内容, Agent 默认忽略.

rules:
  proposal:
    - "可执行资产只能是 Node.js ESM (.mjs)；不得提议 Python、bash/.sh、或外部 skill 作为生产路径"
    - "Stage 2 / style-master / contact sheet 必须落在 PPTMAKER_FRAMEWORK/scripts/ 内"
    - "CLI 硬失败遵守 cli-surface：唯一末行 envelope + bounded secret-safe actionable diagnostic，不得仅散文 Fatal error"
    - "先分类变更类型: narrative-frame / case-anchor / content-constraint / pipeline-script / pipeline-operation"
    - "再分类影响范围: 增删重排先走 Structural Versioning Path；标题按 resolved render mode 分流到 Header Text & Style Refresh / Generated Image Rebuild；body/画面走 Generated Image Rebuild；备注走 Notes-Only Refresh——参照 scripts/change-classifier.md"
    - "涉及哪些 capability, 必须在 Capabilities 段使用 config.yaml 注册表中的 kebab-case identifier——不得自创名字"
    - "结构变更 (增/删/重排 slide)必须走 --new-version"
    - "视觉变更涉及颜色/style master 时, 标注需要 --force-images"
    - "视觉变更超过 1 页时, 先 pilot 3 页再全量"
    - "绝不提议跳过某个 Phase gate 而不写豁免理由"

  specs:
    - "Spec 目录名必须来自 config.yaml capability 注册表——每个 capability 一个 specs/<name>/spec.md"
    - "目录结构引用 PPTMAKER_FRAMEWORK/scripts/bundle_layout.mjs 的常量——不硬编码路径"
    - "使用规范 RENDER MODE 词汇: full-page / body+header-lock (不用 image_direct / normal)"
    - "IMAGE PROMPT 只描述视觉内容 (布局, 颜色, 图标, 图表)——系统契约由 Stage 1 组装"
    - "SPEAKER NOTE 是 60-90 秒叙述流, 不是讲稿"
    - "区分 backbone (所有版本共享)和 version delta (单版本)——改 backbone 影响所有版本"

  tasks:
    - "任务粒度 = pipeline stage 级别 (e.g. '修改 Stage 1 解析逻辑以支持新字段')"
    - "标注 canonical refresh path / Structural Versioning Path 和对应的 --stage 参数"
    - "标注是否需要 --force-images, --only <id>, 或 --new-version"
    - "标注是否需重新生成 style_master.jpg"
    - "标注任务涉及哪些 capability (用注册表 kebab-case identifier)"
    - "每个任务对应到测试文件: tests/test_<script>.mjs (repo 根目录, 与 scripts 一一对应)"
    - "绝不包含需要手动编辑 _generated/ 内容的步骤"

  version:
    - "repo 版本号在根目录 VERSION 文件中（纯文本 semver，如 0.14.3），VERSION 是 SSOT"
    - "archive change 后必须检查：本次变更是否需要 bump 版本"
    - "bump 粒度：新 capability / 破坏性变更 / 架构变化 → MINOR；bug fix / 小改进 → PATCH；纯文档 → 不 bump"
    - "用户确认 bump 后，同步更新 VERSION、VERSION_LOG.md、PPTMAKER_FRAMEWORK/README.md 和 package.json"
